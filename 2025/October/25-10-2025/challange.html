<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Overflow Example</title>
  <style>
    body {
      background-color: #E8AD6D;
    }
    .container {
      position: relative;
      width: 100%;
      height: 80px;
    }
    .rod {
      position: absolute;
      left: 22px;
      top: 53.5px;
      width: 260px;
      height: 16px;
      background: #3B240C;
    }
    .plus1 {
      background-color: #3B240C;
      position: absolute;
      top: 54px;
      right: 22.5px;
      width: 49.1px;
      height: 16.2px;
    }
    .plus2 {
      background-color: #3B240C;
      position: absolute;
      top: 37px;
      right: 39.1px;
      width: 16.2px;
      height: 49.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="rod"></div>
    <div class="plus1"></div>
    <div class="plus2"></div>
  </div>
  <div class="container">
    <div class="rod"></div>
    <div class="plus1"></div>
    <div class="plus2"></div>
  </div>
  <div class="container">
    <div class="rod"></div>
    <div class="plus1"></div>
    <div class="plus2"></div>
  </div>
</body>
</html>
