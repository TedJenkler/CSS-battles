<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Layout Challenge</title>
  <style>
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #FFEA9B;
    }
    div {
      background: #4A9A86;
      position: absolute;
      left: 50%;
      transform: translate(-50%, 0);
    }

    div::after {
      content: "";
      display: flex;
      position: relative;
      top: 0;
      left: 50%;
      transform: translate(-50%, 0);
      background-color: #FFEA9B;
    }
    
    #id1 {
      width: 30px;
      height: 150px;
      bottom: 30px;
    }
    
    #id2 {
      width: 220px;
      height: 30px;
      bottom: 180px;
    }
    
    #id3 {
      width: 280px;
      height: 30px;
      bottom: 210px;
    }

    #id3::after {
      width: 80px;
      height: 30px;
    }

    #id4 {
      width: 340px;
      height: 30px;
      bottom: 240px;
    }

    #id4::after {
      width: 140px;
      height: 30px;
    }
  </style>
</head>
<body>
  <div id="id1"></div>
  <div id="id2"></div>
  <div id="id3"></div>
  <div id="id4"></div>
</body>
</html>
